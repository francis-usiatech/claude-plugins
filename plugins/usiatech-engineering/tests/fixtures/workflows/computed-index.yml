name: Computed index into event fields
on: push
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo ${{ github.event[format('{0}', 'pull_request')].title }}
      - run: |
          echo ${{ github['event']['pull_request']['body'] }}
      - run: |
          echo ${{ github.event[inputs.key] }}
